<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TempConvert — Temperature Converter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0F1110; --card: #1A1E1C; --border: #2A2F2C; --muted: #9AA09B; --accent: #7FE0A0; --error: #FF6B6B; }
body { font-family: Arial, sans-serif; background: var(--bg); color: #EDEBE6; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
.container { width: 100%; max-width: 460px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 { font-size: 28px; letter-spacing: -1px; display: flex; gap: 10px; justify-content: center; align-items: center; }
.header h1 i { color: var(--accent); }
.header p { font-size: 13px; color: var(--muted); margin-top: 6px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }

label { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px; }

.input-wrap { position: relative; margin-bottom: 16px; }
.input-wrap input {
  width: 100%; background: #121412; border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px; font-size: 18px; color: #fff; outline: none;
}
.input-wrap input:focus { border-color: var(--accent); }
.input-wrap input.error { border-color: var(--error); }
.error-msg { font-size: 12px; color: var(--error); margin-top: 6px; display: none; gap: 6px; align-items: center; }
.error-msg.show { display: flex; }

.unit-group { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.select-wrap select {
  width: 100%; background: #121412; border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; font-size: 14px; color: #fff; outline: none;
}
.select-wrap select:focus { border-color: var(--accent); }

.btn {
  width: 100%; background: var(--accent); color: #0F1110; border: none;
  border-radius: 25px; padding: 14px; font-size: 14px; font-weight: 800;
  display: flex; gap: 8px; justify-content: center; align-items: center; cursor: pointer;
}
.btn:hover { opacity: 0.9; }

.results { margin-top: 20px; display: grid; gap: 10px; display: none; }
.results.show { display: grid; }
.result-item { background: #121412; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
.result-item b { font-size: 16px; }
.result-item span { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.result-item.active { border-color: var(--accent); }

.footer-note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1><i class="ri-thermometer-line"></i> TempConvert</h1>
    <p>Convert between Celsius, Fahrenheit & Kelvin — with validation</p>
  </div>

  <div class="card">
    <label><i class="ri-numbers-line"></i> Temperature Value</label>
    <div class="input-wrap">
      <input type="text" id="tempInput" placeholder="e.g. 25" autocomplete="off">
      <div class="error-msg" id="errorMsg"><i class="ri-error-warning-line"></i> <span id="errorText"></span></div>
    </div>

    <div class="unit-group">
      <div class="select-wrap">
        <label>From</label>
        <select id="fromUnit">
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
          <option value="kelvin">Kelvin (K)</option>
        </select>
      </div>
      <div class="select-wrap">
        <label>To (or All)</label>
        <select id="toUnit">
          <option value="all">All Units</option>
          <option value="celsius">Celsius (°C)</option>
          <option value="fahrenheit">Fahrenheit (°F)</option>
          <option value="kelvin">Kelvin (K)</option>
        </select>
      </div>
    </div>

    <button class="btn" id="convertBtn"><i class="ri-refresh-line"></i> Convert</button>

    <div class="results" id="results">
      <div class="result-item" id="resC"><span><i class="ri-snowflake-line"></i> Celsius</span><b id="valC">--</b></div>
      <div class="result-item" id="resF"><span><i class="ri-fire-line"></i> Fahrenheit</span><b id="valF">--</b></div>
      <div class="result-item" id="resK"><span><i class="ri-water-flash-line"></i> Kelvin</span><b id="valK">--</b></div>
    </div>

    <div class="footer-note">Absolute zero: -273.15°C / -459.67°F / 0K</div>
  </div>
</div>

<script>
const tempInput = document.getElementById('tempInput');
const fromUnit = document.getElementById('fromUnit');
const toUnit = document.getElementById('toUnit');
const convertBtn = document.getElementById('convertBtn');
const errorMsg = document.getElementById('errorMsg');
const errorText = document.getElementById('errorText');
const results = document.getElementById('results');

const valC = document.getElementById('valC');
const valF = document.getElementById('valF');
const valK = document.getElementById('valK');
const resC = document.getElementById('resC');
const resF = document.getElementById('resF');
const resK = document.getElementById('resK');

function showError(msg) {
  errorText.textContent = msg;
  errorMsg.classList.add('show');
  tempInput.classList.add('error');
  results.classList.remove('show');
}

function clearError() {
  errorMsg.classList.remove('show');
  tempInput.classList.remove('error');
}

function toCelsius(value, unit) {
  if (unit === 'celsius') return value;
  if (unit === 'fahrenheit') return (value - 32) * 5/9;
  if (unit === 'kelvin') return value - 273.15;
}

function fromCelsius(c, unit) {
  if (unit === 'celsius') return c;
  if (unit === 'fahrenheit') return (c * 9/5) + 32;
  if (unit === 'kelvin') return c + 273.15;
}

function convert() {
  clearError();
  const raw = tempInput.value.trim();

  // [ ] Numeric validation
  if (raw === '') {
    showError('Please enter a temperature value.');
    return;
  }
  if (isNaN(raw)) {
    showError('Invalid input: Only numbers are allowed (e.g., 25, -10, 98.6)');
    return;
  }

  const num = parseFloat(raw);
  const from = fromUnit.value;

  // Convert input to Celsius first to check absolute zero
  const celsiusValue = toCelsius(num, from);

  // [ ] Edge case: absolute zero violation
  if (celsiusValue < -273.15) {
    showError(`Absolute zero violation! Temperature cannot be below -273.15°C. You entered ${num}° ${from} = ${celsiusValue.toFixed(2)}°C`);
    return;
  }

  // Calculate all
  const c = celsiusValue;
  const f = fromCelsius(c, 'fahrenheit');
  const k = fromCelsius(c, 'kelvin');

  valC.textContent = `${c.toFixed(2)} °C`;
  valF.textContent = `${f.toFixed(2)} °F`;
  valK.textContent = `${k.toFixed(2)} K`;

  // Highlight logic for To selector
  resC.classList.remove('active');
  resF.classList.remove('active');
  resK.classList.remove('active');
  
  const to = toUnit.value;
  if (to === 'all') {
    results.classList.add('show');
  } else {
    results.classList.add('show');
    if (to === 'celsius') resC.classList.add('active');
    if (to === 'fahrenheit') resF.classList.add('active');
    if (to === 'kelvin') resK.classList.add('active');
  }
}

convertBtn.addEventListener('click', convert);
tempInput.addEventListener('input', clearError);
tempInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') convert(); });
</script>

</body>
</html>
